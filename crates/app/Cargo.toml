[package]
name = "app"
version = "0.1.0"
edition.workspace = true
description = "Leptos CSR UI: components, routing, top-level state"

[dependencies]
leptos = { version = "0.8", features = ["csr"] }
engine = { path = "../engine" }
snippets = { path = "../snippets" }
console_error_panic_hook = "0.1"
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["KeyboardEvent", "Performance", "Window"] }

[dev-dependencies]
