[package]
name = "app"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Leptos CSR UI: components, routing, top-level state"

[dependencies]
leptos = { version = "0.8", features = ["csr"] }
engine = { path = "../engine" }
snippets = { path = "../snippets" }
syntect = { version = "5.2", default-features = false, features = ["default-syntaxes", "regex-fancy", "plist-load", "dump-load", "metadata"] } # WASM-safe syntax highlighting (regex-fancy instead of onig)
console_error_panic_hook = "0.1"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4" # spawn_local + JsFuture for the PNG export
js-sys = "0.3" # Date::now for user snippet ids
serde = { version = "1", features = ["derive"] } # Settings persistence
serde_json = "1" # localStorage persistence format
web-sys = { version = "0.3", features = [
    "Blob",
    "CanvasRenderingContext2d",
    "console",
    "CssStyleDeclaration",
    "Document",
    "DomRect",
    "Element",
    "FontFaceSet",
    "HtmlAnchorElement",
    "HtmlCanvasElement",
    "KeyboardEvent",
    "Performance",
    "Storage",
    "TextMetrics",
    "Url",
    "Window",
] }

[dev-dependencies]
