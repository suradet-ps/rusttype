name: Bug report
description: Something is not working as it should
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping make RustType better. Please fill in the fields below.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: A short, clear description of the problem.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Click ...
        3. See ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include the visible error or the wrong character state, if any.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Typing engine (strict mode, cursor)
        - Indentation and whitespace
        - Code display and syntax highlighting
        - Stats (WPM, accuracy, worst tokens)
        - Virtual keyboard
        - Snippets (embedded or user-provided)
        - Challenges and stars
        - Session history and export
        - Not sure
    validations:
      required: true
  - type: dropdown
    id: browser
    attributes:
      label: Browser
      options:
        - Chrome
        - Firefox
        - Safari
        - Edge
        - Other
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows
        - macOS
        - Linux
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: RustType version
      placeholder: "0.1.0"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or extra context
      description: Paste the browser console output if relevant.
      render: text
    validations:
      required: false
