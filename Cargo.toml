[workspace]
resolver = "2"
members = ["crates/engine", "crates/snippets", "crates/app"]

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/suradet-ps/rusttype"

[workspace.dependencies]
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Small + fast WASM binary.
[profile.release]
lto = true
codegen-units = 1
opt-level = 3
